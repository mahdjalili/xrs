[package]
name = "xrs"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Mahdi <mahdiwise@gmail.com>"]
description = "xrs - an xray cli-first ultra fast lightweight client"
repository = "https://github.com/mahdjalili/xrs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
colored = "3.1.1"
crossterm = "0.29.0"
dirs = "7.0.0"
eyre = "0.6.14"
notify = "8.2.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
toml = "1.1.6"
unicode-width = "0.2.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.4.2", features = ["json"] }
url = "2.5.8"
which = "8.0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
