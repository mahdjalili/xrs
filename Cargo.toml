[package]
name = "xrs"
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Mahdi <mahdiwise@gmail.com>"]
description = "xrs - an xray cli-first ultra fast lightweight client"
repository = "https://github.com/mahdjalili/xrs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
crossterm = "0.29.0"
eyre = "0.6.14"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }
unicode-width = "0.2.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std", "tracing-log"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip"] }
url = "2.5.8"
socket2 = { version = "0.6.5", features = ["all"] }
percent-encoding = "2.3.2"
signal-hook = { version = "0.4.4", default-features = false, features = ["iterator"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
