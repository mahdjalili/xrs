[package]
name = "xrs"
version = "0.8.0"
edition = "2024"
license = "MIT"
authors = ["Mahdi <mahdiwise@gmail.com>"]
description = "xrs - an xray cli-first ultra fast lightweight client"
repository = "https://github.com/mahdjalili/xrs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
crossterm = "0.29.0"
eyre = "0.6.14"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-width = "0.2.2"
log = "0.4.34"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip"] }
socket2 = { version = "0.6.5", features = ["all"] }
percent-encoding = "2.3.2"
signal-hook = { version = "0.3.18", default-features = false, features = ["iterator"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
