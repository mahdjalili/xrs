name: build-linux

# Build all Linux packages on version tags (v0.1.0, ...).
# Manual runs are also possible from the Actions tab (workflow_dispatch).
# This workflow ONLY builds and uploads artifacts - it publishes nothing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for Sigstore keyless signing (Fulcio OIDC)

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install aarch64 cross toolchain
        if: matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tarball + checksums
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            pkgver="${GITHUB_REF_NAME#v}"
          else
            pkgver="0.0.0-dev-${GITHUB_SHA::7}"
          fi
          pkgname="xrs-${pkgver}-${{ matrix.target }}"
          mkdir -p "dist/${pkgname}"
          cp "target/${{ matrix.target }}/release/xrs" "dist/${pkgname}/"
          cp README.md LICENSE "dist/${pkgname}/"
          tar -czf "dist/${pkgname}.tar.gz" -C dist "${pkgname}"
          ( cd dist && sha256sum "${pkgname}.tar.gz" > "${pkgname}.tar.gz.sha256" )
          echo "PKGNAME=${pkgname}" >> "$GITHUB_ENV"
          ls -lh dist/

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Sign tarball (Sigstore keyless)
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature "dist/${PKGNAME}.tar.gz.sig" \
            --output-certificate "dist/${PKGNAME}.tar.gz.pem" \
            "dist/${PKGNAME}.tar.gz"
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xrs-${{ matrix.target }}
          path: dist/*.tar.gz*
          retention-days: 14

  release:
    name: release (${{ github.ref_name }})
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -lh release-assets/
          cat > release-assets/RELEASE_NOTES.md <<'EOF'
          ## xrs - Linux builds

          Each `.tar.gz` contains the `xrs` binary, README and LICENSE.

          Verify a download with [cosign](https://docs.sigstore.dev/cosign/installation/):

          ```bash
          cosign verify-blob \
            --certificate-identity-regexp '^https://github.com/mahdjalili/xrs' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --cert <file>.tar.gz.pem \
            --signature <file>.tar.gz.sig \
            <file>.tar.gz
          ```
          EOF
          gh release create "${GITHUB_REF_NAME}" release-assets/xrs-* \
            --title "xrs ${GITHUB_REF_NAME}" \
            --notes-file release-assets/RELEASE_NOTES.md
